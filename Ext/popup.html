<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agar.io Mode</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
        * { font-family: "Inter", sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #111; color: #fff; width: 210px; padding: 14px; }
        h1 { font-size: 15px; font-weight: 600; text-align: center; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; color: #fff; }
        .mode-button {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px 16px;
            font-size: 13px;
            margin: 6px 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #ccc;
            width: 100%;
        }
        .mode-button:hover { background: #2b2b2b; border-color: #666; }
        .mode-button.active {
            background: #363636e6;
            color: #fff;
            border-color: rgba(92, 92, 92, 0.849);
            box-shadow: 0 2px 8px rgba(65, 65, 65, 0.3);
        }
        .note { font-size: 10px; color: #555; text-align: center; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>ScarzBots</h1>
    <div class="mode-button" data-mode="delta">Delta</div>
    <div class="mode-button" data-mode="doublesplit">Doublesplit</div>
        <p class="note">Developed by Storm</p>
    <script src="popup.js"></script>
  </body>
</html>
